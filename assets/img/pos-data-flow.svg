<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">POS system data flow</title>
  <desc id="d">A sale entered on the touchscreen checkout is shown on the customer display, printed as a receipt, and saved as a structured JSON transaction record. Records are validated on load and feed sales reports, PDF financial reports, and an automatic monthly backup.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="#f5f7fa"/>

  <!-- connectors -->
  <g fill="none" stroke="#15803d" stroke-width="2">
    <path d="M135 185 V114" marker-end="url(#arrow)"/>
    <path d="M135 265 V336" marker-end="url(#arrow)"/>
    <path d="M230 225 H297" marker-end="url(#arrow)"/>
    <path d="M495 205 C530 205 530 105 562 105" marker-end="url(#arrow)"/>
    <path d="M495 225 H562" marker-end="url(#arrow)"/>
    <path d="M495 245 C530 245 530 345 562 345" marker-end="url(#arrow)"/>
  </g>
  <path d="M400 277 V298" fill="none" stroke="#9aa6b6" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- capture -->
  <g>
    <rect x="40" y="50" width="190" height="62" rx="10" fill="#fff" stroke="#e2e7ee"/>
    <text x="135" y="77" text-anchor="middle" font-size="14" font-weight="600" fill="#17202e">Customer display</text>
    <text x="135" y="96" text-anchor="middle" font-size="12" fill="#586374">serial connection</text>

    <rect x="40" y="185" width="190" height="80" rx="10" fill="#15803d"/>
    <text x="135" y="219" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Touchscreen checkout</text>
    <text x="135" y="240" text-anchor="middle" font-size="12" fill="#f0fdf4">Tkinter keypad · auto-decimal</text>

    <rect x="40" y="338" width="190" height="62" rx="10" fill="#fff" stroke="#e2e7ee"/>
    <text x="135" y="365" text-anchor="middle" font-size="14" font-weight="600" fill="#17202e">Receipt printer</text>
    <text x="135" y="384" text-anchor="middle" font-size="12" fill="#586374">ESC/POS</text>
  </g>

  <!-- record -->
  <g>
    <rect x="305" y="165" width="190" height="112" rx="10" fill="#fff" stroke="#15803d" stroke-width="2"/>
    <text x="400" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#17202e">Sale record (JSON)</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#586374">
      <text x="325" y="214">id · datetime</text>
      <text x="325" y="231">products</text>
      <text x="337" y="248">name · price · qty</text>
      <text x="325" y="265">total_amount</text>
    </g>

    <rect x="305" y="300" width="190" height="62" rx="10" fill="#e8f5ec"/>
    <text x="400" y="326" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Validated on load</text>
    <text x="400" y="345" text-anchor="middle" font-size="11.5" fill="#166534">repair · rebuild totals · flag dates</text>
  </g>

  <!-- outputs -->
  <g>
    <rect x="570" y="70" width="190" height="70" rx="10" fill="#fff" stroke="#e2e7ee"/>
    <text x="665" y="99" text-anchor="middle" font-size="14" font-weight="600" fill="#17202e">Sales reports</text>
    <text x="665" y="119" text-anchor="middle" font-size="12" fill="#586374">today · week · month · by month</text>

    <rect x="570" y="190" width="190" height="70" rx="10" fill="#fff" stroke="#e2e7ee"/>
    <text x="665" y="219" text-anchor="middle" font-size="14" font-weight="600" fill="#17202e">PDF financial report</text>
    <text x="665" y="239" text-anchor="middle" font-size="12" fill="#586374">one click · ReportLab</text>

    <rect x="570" y="310" width="190" height="70" rx="10" fill="#fff" stroke="#e2e7ee"/>
    <text x="665" y="339" text-anchor="middle" font-size="14" font-weight="600" fill="#17202e">Monthly backup</text>
    <text x="665" y="359" text-anchor="middle" font-size="12" fill="#586374">automatic on the 1st</text>
  </g>
</svg>
